services:
  piaware:
    image: ghcr.io/sdr-enthusiasts/docker-piaware:latest
    container_name: piaware
    restart: unless-stopped
    ports:
      - "8091:80"
    environment:
      - TZ=America/New_York
      - RECEIVER_TYPE=relay
      - BEASTHOST=host.docker.internal
      - BEASTPORT=30005
      # - FEEDER_ID=YOUR_FEEDER_ID  # Set after first run
      - ALLOW_MLAT=yes
      - MLAT_RESULTS=yes
      - MLAT_RESULTS_BEASTHOST=host.docker.internal
      - MLAT_RESULTS_BEASTPORT=30104
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /var/cache/piaware:/var/cache/piaware

  adsbhub:
    image: ghcr.io/sdr-enthusiasts/docker-adsbhub:latest
    container_name: adsbhub
    restart: unless-stopped
    ports:
      - "8092:80"
    environment:
      - TZ=America/New_York
      - SBSHOST=host.docker.internal
      - SBSPORT=30003
      - CLIENTKEY=${ADSBHUB_STATION_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"

  opensky:
    image: ghcr.io/sdr-enthusiasts/docker-opensky-network:latest
    container_name: opensky
    restart: unless-stopped
    ports:
      - "8093:80"
    environment:
      - TZ=America/New_York
      - BEASTHOST=host.docker.internal
      - BEASTPORT=30005
      - LAT=${OPENSKY_LAT:-39.09725}
      - LONG=${OPENSKY_LONG:--77.01173}
      - ALT=${OPENSKY_ALT:-46}
      - OPENSKY_USERNAME=${OPENSKY_USERNAME:-}
      - OPENSKY_SERIAL=${OPENSKY_SERIAL:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    tmpfs:
      - /run:exec,size=64M
      - /var/log
